
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html pv.js config.js manifest.json sw.js www/

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init Clipghor com.clipghor.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set app name
        run: |
          FILE=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">ক্লিপঘর</string>#' "$FILE"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: clipghor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
