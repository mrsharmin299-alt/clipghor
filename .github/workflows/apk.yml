name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          mkdir www
          cp index.html pv.js config.js manifest.json sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init Clipghor com.clipghor.app --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">ক্লিপঘর</string>#' android/app/src/main/res/values/strings.xml
          res=android/app/src/main/res
          rm -f $res/mipmap-anydpi-v26/ic_launcher.xml $res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do for f in ic_launcher ic_launcher_round ic_launcher_foreground; do cp icon-512.png $res/mipmap-$d/$f.png; done; done
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clipghor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
