
name: Build Flixeok Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }
          test -f capacitor.config.json || {
            echo "ERROR: capacitor.config.json not found"
            exit 1
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app if build script exists
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flixeok-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
